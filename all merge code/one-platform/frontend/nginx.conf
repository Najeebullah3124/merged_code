server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Smart pricing car (FastAPI) — strip /api prefix to match upstream routes
    location ~ ^/api/(listings|listing/|pricing-try-values|pricing-calendar|pricing-signals|demand-data|override-price|audit-logs|quote|simulate|optimize|admin/|auth/) {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://car-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Airbnb smart pricing (FastAPI)
    location ^~ /api/airbnb/ {
        rewrite ^/api/airbnb/?(.*)$ /api/$1 break;
        proxy_pass http://airbnb-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
