name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and integration tests
        run: npm test

      - name: Start service for reliability gates
        run: npm start &

      - name: Wait for service
        run: sleep 5

      - name: Run load test gate
        run: npm run loadtest

      - name: Run chaos gate
        run: CHAOS_ENABLED=true npm run chaos
