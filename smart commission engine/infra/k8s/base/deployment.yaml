apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-commission-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smart-commission-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: smart-commission-engine
    spec:
      containers:
        - name: api
          image: ghcr.io/example/smart-commission-engine:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
